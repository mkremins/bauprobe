<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Praxish Demo: Space</title>
	<style>
	* { box-sizing: border-box; margin: 0; padding: 0; }
	body { font-family: sans-serif; line-height: 1.2; padding: 2ch; }
	h1, p { margin-bottom: 1rem; }
	#app { display: flex; }
	.world-editor { width: 50%; padding: 1ch; }
	.editor-toolbar { border: 1px solid #ccc; padding: 0.5ch; }
	.editor-toolbar > * { margin-right: 1ch; }
	button { all: unset; background: #ccc; cursor: pointer; padding: 0.5ch; }
	button.active { background: forestgreen; color: white; }
	.room-inspector { width: 50%; padding: 1ch; }
	.room-data { margin-bottom: 0.5rem; padding: 0.5ch; border-radius: 0.5ch; }
	</style>
</head>
<body>
	<h1>Praxish Demo: Space</h1>
	<p>This is a demo of the <a href="https://github.com/mkremins/praxish">Praxish framework</a> for constructing interactive narrative social simulations, specifically focused on how Praxish simulations can be combined with realtime gameplay in a navigable world.</p>
	<div id="app"></div>
	<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
	<script src="util.js"></script>
	<script src="app.js"></script>
</body>
</html>
